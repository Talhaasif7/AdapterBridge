name: 'AdapterBridge Pre-Flight Check'
description: 'Pre-flight LoRA adapter compatibility linter & validator for enterprise inference engines (vLLM, SGLang, Ollama, TensorRT-LLM)'
author: 'AdapterBridge Team'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  path:
    description: 'Path to checkpoint directory'
    required: true
    default: './'
  target:
    description: 'Target inference engine (vllm, sglang, ollama, tensorrt)'
    required: true
    default: 'vllm'
  format:
    description: 'Output format (text, json, sarif, markdown, pr-comment)'
    required: false
    default: 'text'
  output:
    description: 'Optional file output path'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install AdapterBridge
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install adapterbridge

    - name: Run AdapterBridge Check
      shell: bash
      run: |
        CMD="adapterbridge check --path '${{ inputs.path }}' --target '${{ inputs.target }}' --format '${{ inputs.format }}'"
        if [ -n "${{ inputs.output }}" ]; then
          CMD="$CMD --output '${{ inputs.output }}'"
        fi
        eval $CMD
