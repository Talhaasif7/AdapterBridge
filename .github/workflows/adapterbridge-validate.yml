name: Validate Adapter Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  adapterbridge-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Adapter Checkpoints
        uses: ./
        with:
          checkpoint-path: ./examples/sample_adapter
          target-engine: vllm
          fail-on-warning: false
